<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raamsensoren</title>
<!-- Officiële Athom Web API client (levert window.AthomCloudAPI en window.HomeyAPI) -->
<script type="text/javascript" src="https://cdn.athom.com/homey-api/3.19.4.js"></script>
<style>
  :root{
    --closed-a:#153328; --closed-b:#2E7D5B;
    --open-a:#3A1712;   --open-b:#B3452F;
    --wait-a:#24272b;   --wait-b:#3b4046;
    --ink:#f4f7f5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#0b0d0f;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  .row{
    display:flex;
    width:100vw;
    height:100vh;
  }
  .tile{
    flex:1 1 0;
    height:100%;
    padding:5vw 4vw;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    color:var(--ink);
    background:linear-gradient(160deg, var(--wait-a), var(--wait-b));
    transition:background 600ms ease;
    position:relative;
    overflow:hidden;
  }
  .tile[data-state="closed"]{ background:linear-gradient(160deg, var(--closed-a), var(--closed-b)); }
  .tile[data-state="open"]{   background:linear-gradient(160deg, var(--open-a),  var(--open-b)); }

  .name{
    font-size:clamp(14px, 2.4vw, 20px);
    font-weight:500;
    opacity:.78;
    letter-spacing:.01em;
  }

  .icon{
    align-self:flex-start;
    width:clamp(28px, 6vw, 56px);
    height:clamp(28px, 6vw, 56px);
  }
  .icon .sash{
    transform-origin: 4px 27px;
    transition: transform 600ms ease;
  }
  .tile[data-state="open"] .sash{ transform: rotate(-38deg); }

  .status{
    display:flex;
    flex-direction:column;
    gap:.3em;
  }
  .status .value{
    font-size:clamp(22px, 5vw, 42px);
    font-weight:600;
  }

  /* Kleine inlog-knop, alleen zichtbaar als er nog geen sessie is */
  .login-screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#0b0d0f; color:var(--ink);
    font-size:4vw; text-align:center; padding:0 6vw;
  }
  .login-screen button{
    margin-top:1.2em;
    font-size:0.5em;
    padding:.7em 1.4em;
    border-radius:.6em;
    border:none;
    background:#2E7D5B;
    color:white;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="row" id="row"></div>

<script type="module">
/* ---------- CONFIGURATIE ---------- */
const CONFIG = {
  // Client ID + Secret van je eigen Web API Client, aan te maken via
  // https://tools.developer.homey.app  ->  "Web API Clients" / "OAuth2 Clients".
  CLIENT_ID:     "6aa3a9c70f8789ee9cd9a05e",
  CLIENT_SECRET: "641d1c8de1d35f2b9875451623a0509f",

  // Moet exact overeenkomen met de Redirect URL die je bij het aanmaken
  // van de Web API Client hebt opgegeven, én met de URL waarop dit
  // bestand daadwerkelijk wordt gehost (dus geen file://, wel https://...).
  REDIRECT_URL:  "https://harrynaccy.github.io/homey-scrips/raamsensor-tegels-kiosk.html",

  DEVICES: [
    { id: "ea3ef8e0-a77a-4ad9-b1a3-16e551e4dce9", name: "Slaapkamer" },
    { id: "e16950a6-5b9b-4609-a9de-b33e8175f816", name: "Voordeur" },
    { id: "8b30e65a-1177-4540-b5eb-04c3429dcf7f", name: "Keuken" }
  ],

  // Extra veiligheidsnet: elke X ms alle apparaten opnieuw ophalen,
  // zodat de status ook bijwerkt als er ooit een live update gemist
  // wordt (bv. na een korte verbindingshapering op de achtergrond).
  REFRESH_MS: 15000
};
/* ---------------------------------- */

const iconSVG = `
  <svg class="icon" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="3" width="28" height="28" rx="3" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <line class="sash" x1="4" y1="27" x2="30" y2="27" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  </svg>`;

const row = document.getElementById("row");
const tilesById = {};

CONFIG.DEVICES.forEach(dev => {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.dataset.state = "wait";
  tile.dataset.id = dev.id;
  tile.innerHTML = `
    <div class="name">${dev.name}</div>
    ${iconSVG}
    <div class="status">
      <div class="value">Verbinden…</div>
    </div>`;
  row.appendChild(tile);
  tilesById[dev.id] = tile;
});

function paint(id, isOpen){
  const tile = tilesById[id];
  if(!tile) return;
  const valueEl = tile.querySelector(".value");
  tile.dataset.state = isOpen ? "open" : "closed";
  valueEl.textContent = isOpen ? "Open" : "Gesloten";
}

function paintError(){
  Object.values(tilesById).forEach(tile => {
    tile.dataset.state = "wait";
    tile.querySelector(".value").textContent = "Geen verbinding";
  });
}

function showLoginScreen(loginUrl){
  const screen = document.createElement("div");
  screen.className = "login-screen";
  screen.innerHTML = `
    Log in bij Athom om deze kiosk te koppelen aan je Homey
    <br>
    <button id="loginBtn">Inloggen</button>`;
  document.body.appendChild(screen);
  document.getElementById("loginBtn").addEventListener("click", () => {
    window.location.href = loginUrl;
  });
}

function readAndPaint(device){
  if(!device || !tilesById[device.id]) return;
  const cap = device.capabilitiesObj && device.capabilitiesObj.alarm_contact;
  if(!cap){
    console.warn(`Geen alarm_contact-capability gevonden voor ${device.name || device.id}`, device.capabilitiesObj);
    return;
  }
  console.debug(`[${new Date().toLocaleTimeString()}] ${device.name || device.id}: alarm_contact =`, cap.value);
  paint(device.id, !!cap.value);
}

/* ---------- Verbinden via de officiële Athom Cloud API (OAuth2) ---------- */
async function start(){
  const cloudApi = new AthomCloudAPI({
    clientId: CONFIG.CLIENT_ID,
    clientSecret: CONFIG.CLIENT_SECRET,
    redirectUrl: CONFIG.REDIRECT_URL,
    // AthomCloudAPI bewaart het token standaard in de browseropslag,
    // zodat de kiosk na een herstart niet telkens opnieuw hoeft in te loggen.
  });

  const loggedIn = await cloudApi.isLoggedIn();
  if(!loggedIn){
    if(cloudApi.hasAuthorizationCode()){
      await cloudApi.authenticateWithAuthorizationCode();
    }else{
      showLoginScreen(cloudApi.getLoginUrl());
      return;
    }
  }

  const user = await cloudApi.getAuthenticatedUser();
  const homey = await user.getFirstHomey();
  const homeyApi = await homey.authenticate();

  const devices = await homeyApi.devices.getDevices();

  // Verbind met de Socket.io-namespace van de devices-manager.
  // Dit is nodig voordat individuele capability-subscripties werken.
  await homeyApi.devices.connect();

  // Voor elk raamsensor-apparaat: direct de huidige stand tonen,
  // en daarna een échte live subscription op de alarm_contact-capability
  // zetten. Homey pusht dan zelf een update zodra de waarde verandert,
  // in plaats van dat wij moeten wachten op een grotere 'device.update'.
  CONFIG.DEVICES.forEach(dev => {
    const device = devices[dev.id];
    if(!device){
      console.warn(`Apparaat ${dev.name} (${dev.id}) niet gevonden bij deze Homey.`);
      return;
    }

    readAndPaint(device); // initiële stand

    device.makeCapabilityInstance("alarm_contact", (value) => {
      console.debug(`[live] ${dev.name}: alarm_contact =`, value);
      paint(dev.id, !!value);
    });
  });

  // Veiligheidsnet: ook op de achtergrond periodiek alles opnieuw ophalen,
  // zodat de status altijd actueel blijft, zelfs als een live capability-
  // update ooit gemist wordt (bv. na een korte verbindingshapering).
  if(backgroundRefreshTimer) clearInterval(backgroundRefreshTimer);
  backgroundRefreshTimer = setInterval(async () => {
    try{
      const freshDevices = await homeyApi.devices.getDevices();
      Object.values(freshDevices).forEach(readAndPaint);
    }catch(err){
      console.warn("Achtergrond-refresh mislukt:", err);
    }
  }, CONFIG.REFRESH_MS);
}

let backgroundRefreshTimer = null;

start().catch(err => {
  console.error("Kon geen cloudverbinding met Homey maken:", err);
  paintError();
  // Probeer het na een tijdje automatisch opnieuw (bv. als Homey even offline was)
  setTimeout(() => start().catch(() => {}), 30000);
});
</script>

</body>
</html>
