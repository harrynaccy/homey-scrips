<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Platenkast</title>
<style>
  :root{ --panorama-width:1280px; --panorama-height:784px; --panorama-offset:-640px; --panorama-voffset:0px; --green:#1DB954; }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#0b0d0f; color:#fff;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  .wrap{ position:relative; width:100%; height:100%; overflow:hidden; }

  /* ---------- Panorama-achtergrond: 3e kwart van de hoes (zoals alle tegels) ---------- */
  .bg{
    position:absolute; inset:-20px;
    background-repeat:no-repeat;
    background-size:var(--panorama-width) var(--panorama-height);
    background-position:var(--panorama-offset) calc(50% + var(--panorama-voffset));
    filter:blur(10px) brightness(.55);
    transform:scale(1.15);
    transition:background-image 250ms ease, background-position 250ms ease;
    z-index:0;
  }
  .shade{ position:absolute; inset:0; z-index:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.55) 100%); }

  .scroll{
    position:relative; z-index:1; height:100%;
    overflow-y:auto; overflow-x:hidden;
    padding:1em .9em 1.4em .9em;
    -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain;
  }
  .scroll::-webkit-scrollbar, .trackList::-webkit-scrollbar{ width:4px; }
  .scroll::-webkit-scrollbar-thumb, .trackList::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.2); border-radius:4px; }

  .title{ font-size:clamp(16px,3.8vw,21px); font-weight:700; }
  .subtitle{ font-size:12px; opacity:.6; margin-top:.2em; min-height:1.2em; }
  .section{ margin-top:1.6em; }
  .sectionTitle{
    font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    opacity:.55; margin:0 0 .6em .1em;
  }

  /* ---------- Uitgelichte nieuwste release ---------- */
  .hero{ margin-top:.9em; cursor:pointer; }
  .heroArt{
    position:relative; width:100%; aspect-ratio:1/1; border-radius:14px;
    background:#1b1f23 center/cover no-repeat;
    box-shadow:0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06) inset;
    overflow:hidden;
  }
  .heroArt::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  .heroTag{
    position:absolute; left:.7em; top:.7em; z-index:1;
    font-size:10px; font-weight:800; letter-spacing:.08em;
    background:var(--green); color:#000; border-radius:5px; padding:.25em .55em;
  }
  .heroTag.soon{ background:#fff; }
  .heroPlay{
    position:absolute; right:.7em; bottom:.7em; z-index:1;
    width:52px; height:52px; border-radius:50%; border:0;
    background:var(--green); color:#000; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.45); cursor:pointer;
  }
  .heroPlay:active{ transform:scale(.94); }
  .heroName{ font-size:clamp(17px,4.2vw,22px); font-weight:800; margin-top:.65em; line-height:1.2;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .heroMeta{ font-size:13px; opacity:.7; margin-top:.2em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hero.playing .heroName{ color:var(--green); }

  /* ---------- Rijen (zelfde stijl als acc4) ---------- */
  .row{ display:flex; align-items:center; gap:.7em; padding:.45em .3em; border-radius:10px; cursor:pointer; }
  .row:active{ background:rgba(255,255,255,.06); }
  .rowArt{ width:44px; height:44px; border-radius:6px; background:#222 center/cover no-repeat; flex-shrink:0; }
  .rowInfo{ min-width:0; flex:1; }
  .rowName{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rowMeta{ font-size:12px; opacity:.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.playing .rowName{ color:var(--green); }
  .badge{ display:inline-block; font-size:9px; font-weight:800; letter-spacing:.05em;
    background:var(--green); color:#000; border-radius:4px; padding:.1em .4em; margin-left:.4em; vertical-align:middle; }
  .badge.soon{ background:#fff; }

  /* Equalizer-balkjes (zelfde als playlist.html) */
  .eq{ position:absolute; right:6px; bottom:6px; display:none; gap:2px; align-items:flex-end; height:14px;
    padding:3px 4px; border-radius:4px; background:rgba(0,0,0,.55); }
  .row .eq{ position:static; background:transparent; padding:0; height:14px; flex-shrink:0; margin-right:.2em; }
  .row.playing .eq, .hero.playing .eq{ display:flex; }
  .hero .eq{ left:.7em; right:auto; bottom:.9em; height:18px; z-index:1; }
  .eq i{ width:3px; background:var(--green); border-radius:1px; animation:eq 900ms ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:-300ms; } .eq i:nth-child(3){ animation-delay:-600ms; }
  @keyframes eq{ 0%,100%{ height:25%; } 50%{ height:100%; } }

  .row.tapped, .trackRow.tapped{ background:rgba(255,255,255,.1); }
  .hero.tapped .heroArt{ box-shadow:0 0 0 3px rgba(255,255,255,.35), 0 18px 40px rgba(0,0,0,.55); }
  .row .addBtn{ margin-left:.2em; }
  .heroAdd{
    position:absolute; right:4.6em; bottom:1.05em; z-index:1;
    width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(255,255,255,.6); background:rgba(0,0,0,.45); color:#fff;
    font-size:20px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .heroAdd:active{ transform:scale(.94); }
  .empty{ font-size:13px; opacity:.6; line-height:1.5; padding:.6em .2em; }

  /* ---------- Albumdetail, kiezer, toast (zelfde als vorige acc3) ---------- */
  .detail{ position:absolute; inset:0; z-index:5; display:none; flex-direction:column;
    background:rgba(8,10,12,.82); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .detail.open{ display:flex; }
  .detailHead{ display:flex; gap:.9em; align-items:flex-end; padding:1em 1em .8em 1em; flex-shrink:0; }
  .detailArt{ width:96px; height:96px; border-radius:8px; background:#222 center/cover no-repeat;
    box-shadow:0 10px 22px rgba(0,0,0,.5); flex-shrink:0; }
  .detailText{ min-width:0; flex:1; }
  .detailType{ font-size:11px; opacity:.6; text-transform:uppercase; letter-spacing:.06em; }
  .detailName{ font-size:clamp(16px,3.8vw,20px); font-weight:700; line-height:1.2;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .detailMeta{ font-size:12px; opacity:.65; margin-top:.25em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .detailButtons{ display:flex; gap:.5em; align-items:center; padding:0 1em .8em 1em; flex-shrink:0; }
  .btn{ border:0; border-radius:999px; font:inherit; font-size:13px; font-weight:600; padding:.6em 1.1em;
    color:#fff; background:rgba(255,255,255,.12); cursor:pointer; }
  .btn:active{ transform:scale(.96); }
  .btn.primary{ background:var(--green); color:#000; }
  .btn.back{ margin-left:auto; background:transparent; opacity:.8; }
  .trackList{ flex:1; overflow-y:auto; overflow-x:hidden; padding:0 .6em 1em .6em;
    -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain; }
  .trackRow{ display:flex; align-items:center; gap:.7em; padding:.55em .4em; border-radius:8px; cursor:pointer; }
  .trackRow:active{ background:rgba(255,255,255,.06); }
  .trackNum{ width:1.6em; text-align:right; font-size:13px; opacity:.5; flex-shrink:0; }
  .trackInfo{ min-width:0; flex:1; }
  .trackName{ font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trackArtists{ font-size:11px; opacity:.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trackRow.playing .trackName{ color:var(--green); font-weight:600; }
  .trackRow.playing .trackNum{ color:var(--green); opacity:1; }
  .trackDur{ font-size:12px; opacity:.5; flex-shrink:0; }
  .addBtn{ width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.3); background:transparent;
    color:#fff; font-size:18px; line-height:1; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .msg{ text-align:center; padding:1.5em 1em; font-size:13px; opacity:.6; line-height:1.5; }

  .sheetBackdrop{ position:absolute; inset:0; z-index:10; background:rgba(0,0,0,.55); display:none; align-items:flex-end; }
  .sheetBackdrop.open{ display:flex; }
  .sheet{ width:100%; background:#16191c; border-radius:16px 16px 0 0; padding:1em 1em 1.3em 1em; box-shadow:0 -10px 30px rgba(0,0,0,.5); }
  .sheetTitle{ font-size:13px; opacity:.7; margin-bottom:.8em; line-height:1.4; }
  .sheetTitle b{ color:#fff; }
  .sheetGrid{ display:grid; grid-template-columns:1fr 1fr; gap:.5em; }
  .sheetGrid .btn{ padding:.85em .5em; border-radius:10px; font-size:14px; }
  .sheet .cancel{ width:100%; margin-top:.6em; background:transparent; opacity:.7; }

  .toast{ position:absolute; left:50%; bottom:1.2em; z-index:20; transform:translate(-50%, 20px);
    background:rgba(20,22,25,.95); border-radius:999px; padding:.6em 1.1em; font-size:13px; max-width:90%; text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity 200ms ease, transform 200ms ease; }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .toast.error{ background:#B3452F; }
  .errorBox{
    position:fixed; left:0; right:0; bottom:0;
    background:#B3452F; color:#fff; font-size:12px;
    padding:.6em 1em; z-index:9999; word-break:break-word;
    display:none;
  }
  .diag{
    position:absolute; left:0; right:0; top:0; z-index:9998; display:none;
    background:rgba(0,0,0,.8); color:#9f9; font:11px monospace; padding:4px 8px;
    pointer-events:none; white-space:pre-wrap;
  }
</style>
</head>
<body class="homey-widget-full">
<div class="wrap">
  <div class="bg" id="bg"></div>
  <div class="shade"></div>

  <div class="scroll" id="scroll">
    <div class="title">Platenkast</div>
    <div class="subtitle" id="subtitle">&nbsp;</div>

    <div id="heroBox"></div>

    <div class="section" id="moreBox"></div>

    <div class="section">
      <div class="sectionTitle">Onlangs gedraaid</div>
      <div id="grid"></div>
    </div>
  </div>

  <div class="detail" id="detail">
    <div class="detailHead">
      <div class="detailArt" id="detailArt"></div>
      <div class="detailText">
        <div class="detailType" id="detailType"></div>
        <div class="detailName" id="detailName"></div>
        <div class="detailMeta" id="detailMeta"></div>
      </div>
    </div>
    <div class="detailButtons">
      <button class="btn primary" id="detailPlay">▶ Afspelen</button>
      <button class="btn" id="detailAdd">＋ Toevoegen</button>
      <button class="btn back" id="detailBack">✕ Sluiten</button>
    </div>
    <div class="trackList" id="trackList"></div>
  </div>

  <div class="sheetBackdrop" id="sheetBackdrop">
    <div class="sheet">
      <div class="sheetTitle" id="sheetTitle"></div>
      <div class="sheetGrid" id="sheetGrid"></div>
      <button class="btn cancel" id="sheetCancel">Annuleren</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<div class="diag" id="diag"></div>
<div class="errorBox" id="errorBox"></div>

<script>
/* ==========================================================================
   Widget "Platenkast" (acc3)

   Bovenaan: NIEUW VAN JE ARTIESTEN — het nieuwste album van de artiesten die
   je draait. Kent Aura de artiest al, dan komt het album uit dat geheugen
   (Spotify, meteen speelbaar); anders via MusicBrainz, met hoezen van het
   Cover Art Archive. Daaronder: ONLANGS GEDRAAID — bijgehouden door de app.

   Alles komt van de app op de Homey. Spotify wordt ALLEEN aangesproken als je
   zelf tikt (album zoeken/openen, afspelen, toevoegen).
   ========================================================================== */
(function(){
  var HAPI = null;
  var S = null;                 // afspeelstatus van de app
  var P = null;                 // platenkast-gegevens van de app
  var receivedAt = 0;
  var currentHeight = 0;
  var debugOn = false;
  var WS = {};                  // widget-instellingen

  /* ---------- Panorama-achtergrond: kwart 3 ---------- */
  var PANEL_INDEX = 2;
  var PANEL_COUNT = 4;
  var root = document.documentElement;
  // Achtergrond: standaard het eigen kwart van de hoes, of (widget-instelling
  // "Achtergrond") een ander kwart of de hele hoes.
  function updatePanorama(){
    var w = root.clientWidth, h = root.clientHeight;
    if(!w || !h) return;
    var bgEl = document.getElementById("bg");
    if(WS.panorama === "whole"){
      bgEl.style.backgroundSize = "cover";
      bgEl.style.backgroundPosition = "center";
      return;
    }
    bgEl.style.backgroundSize = "";
    bgEl.style.backgroundPosition = "";
    var idx = /^[1-4]$/.test(String(WS.panorama)) ? Number(WS.panorama) - 1 : PANEL_INDEX;
    root.style.setProperty("--panorama-width", (w * PANEL_COUNT) + "px");
    root.style.setProperty("--panorama-height", h + "px");
    root.style.setProperty("--panorama-offset", (-idx * w) + "px");
  }
  updatePanorama();
  window.addEventListener("resize", updatePanorama);
  if(window.ResizeObserver) new ResizeObserver(updatePanorama).observe(root);

  var NEW_BADGE_DAYS = 30;
  var DAY_MS = 86400000;

  var $ = function(id){ return document.getElementById(id); };
  var els = {
    bg: $("bg"), scroll: $("scroll"), subtitle: $("subtitle"),
    heroBox: $("heroBox"), moreBox: $("moreBox"), grid: $("grid"),
    detail: $("detail"), detailArt: $("detailArt"), detailType: $("detailType"), detailName: $("detailName"),
    detailMeta: $("detailMeta"), detailPlay: $("detailPlay"), detailAdd: $("detailAdd"), detailBack: $("detailBack"),
    trackList: $("trackList"), sheetBackdrop: $("sheetBackdrop"), sheetTitle: $("sheetTitle"),
    sheetGrid: $("sheetGrid"), sheetCancel: $("sheetCancel"), toast: $("toast"),
    errorBox: $("errorBox"), diag: $("diag")
  };
  function esc(s){ var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

  var toastTimer = null;
  function toast(m, err){
    els.toast.textContent = m; els.toast.classList.toggle("error", !!err); els.toast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ els.toast.classList.remove("show"); }, err ? 4500 : 2500);
  }

  var MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  function parseDate(d){ if(!d) return 0; var p = d.split("-"); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1).getTime(); }
  function fmtDate(d){
    if(!d) return ""; var p = d.split("-");
    if(p[2]) return (+p[2]) + " " + MONTHS[+p[1] - 1] + " " + p[0];
    if(p[1]) return MONTHS[+p[1] - 1] + " " + p[0];
    return p[0];
  }
  function agoText(t){
    var d = new Date(t), now = new Date();
    var hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    if(d.toDateString() === now.toDateString()) return "vandaag " + hm;
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if(d.toDateString() === y.toDateString()) return "gisteren " + hm;
    var days = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / DAY_MS);
    return days < 7 ? days + " dagen geleden" : d.getDate() + " " + MONTHS[d.getMonth()];
  }
  function releaseTag(r){
    var t = parseDate(r.date);
    if(t > Date.now()) return { cls: "soon", text: "BINNENKORT" };
    if(Date.now() - t < NEW_BADGE_DAYS * DAY_MS) return { cls: "", text: "NIEUW" };
    return null;
  }
  function cssUrl(u){ return String(u || "").replace(/'/g, "%27"); }

  /* ---------------- hoogte (zelfde als de andere widgets) ---------------- */
  function isLandscape(){
    try{
      if(screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf("landscape") === 0;
    }catch(e){}
    if(typeof window.orientation === "number") return Math.abs(window.orientation) === 90;
    return screen.width > screen.height;
  }
  function computeBaseHeight(cfg){
    cfg = cfg || {};
    if(cfg.heightMode === "fixed" && cfg.heightFixed > 0) return Math.round(cfg.heightFixed);
    var sw = screen.width || 0, sh = screen.height || 0;
    var land = isLandscape();
    var screenH = land ? Math.min(sw, sh) : Math.max(sw, sh);
    var margin = land ? (cfg.marginLandscape != null ? cfg.marginLandscape : 140)
                      : (cfg.marginPortrait != null ? cfg.marginPortrait : 180);
    return Math.max(300, Math.round(screenH - margin));
  }
  /* Eigen hoogte per widget (widget-instelling "Hoogte"): standaard de volledige
     hoogte uit de app-instellingen, of een percentage daarvan. */
  function computeHeight(cfg){
    var h = computeBaseHeight(cfg);
    if(WS.height_mode === "percent"){
      var p = Number(WS.height_percent);
      if(!(p > 0)) p = 60;
      p = Math.max(20, Math.min(100, p));
      h = Math.max(200, Math.round(h * p / 100));
    }
    return h;
  }
  function applyHeight(cfg){
    var h = computeHeight(cfg);
    if(h === currentHeight) return;
    currentHeight = h;
    if(HAPI) HAPI.setHeight(h).catch(function(){});
  }
  function onOrientation(){ setTimeout(function(){ applyHeight(S && S.config); updatePanorama(); }, 300); }
  window.addEventListener("orientationchange", onOrientation);
  try{ screen.orientation.addEventListener("change", onOrientation); }catch(e){}

  /* ---------- Handmatige touch-scroll (zelfde aanpak als op de NAS) ---------- */
  var suppressClickUntil = 0;
  document.addEventListener("click", function(e){ if(Date.now() < suppressClickUntil){ e.stopPropagation(); e.preventDefault(); } }, true);
  function enableManualTouchScroll(el){
    var dragging = false, startY = 0, startTop = 0, moved = false;
    el.addEventListener("touchstart", function(e){ if(e.touches.length !== 1) return; dragging = true; moved = false; startY = e.touches[0].clientY; startTop = el.scrollTop; e.stopPropagation(); }, { passive: true });
    el.addEventListener("touchmove", function(e){
      if(!dragging || e.touches.length !== 1) return;
      var dy = startY - e.touches[0].clientY; if(Math.abs(dy) > 8) moved = true;
      el.scrollTop = startTop + dy; e.stopPropagation(); e.preventDefault();
    }, { passive: false });
    var stop = function(){ if(dragging && moved) suppressClickUntil = Date.now() + 350; dragging = false; };
    el.addEventListener("touchend", stop, { passive: true }); el.addEventListener("touchcancel", stop, { passive: true });
  }
  enableManualTouchScroll(els.scroll);
  enableManualTouchScroll(els.trackList);

  /* ---------------- status / fouten ---------------- */
  var flashMsg = "", flashUntil = 0;
  function renderStatus(){
    var msg = "";
    if(Date.now() < flashUntil) msg = flashMsg;
    else if(S){
      var st = S.status || {};
      if(st.spotify === "no-login" || st.spotify === "error" || st.spotify === "blocked") msg = st.spotifyMsg;
    }
    els.errorBox.textContent = msg || "";
    els.errorBox.style.display = msg ? "block" : "none";
    if(debugOn && S){
      var st2 = S.status || {};
      els.diag.style.display = "block";
      els.diag.textContent = "Modus: " + st2.mode + " | Spotify: " + st2.spotify +
        " | verzoeken afgelopen uur: " + st2.requestsLastHour +
        " | artiesten: " + (P ? P.followed + " (" + P.todo + " nog opzoeken)" : "—") +
        " | hoogte: " + currentHeight + "px";
    }
  }
  function flashError(msg){ flashMsg = msg; flashUntil = Date.now() + 6000; renderStatus(); setTimeout(renderStatus, 6100); }

  function send(action, extra){
    if(!HAPI) return Promise.resolve({ ok: false, error: "Nog geen verbinding met de app" });
    var body = { action: action };
    if(extra) for(var k in extra) body[k] = extra[k];
    return HAPI.api("POST", "/command", body).catch(function(err){
      return { ok: false, error: "Opdracht mislukt: " + (err && err.message || err) };
    });
  }

  /* ---------------- achtergrond + wat er speelt ---------------- */
  var lastBgArtUrl = null, playingAlbumId = null, playingTrackId = null;
  function updateBackground(url){
    if(!url || url === lastBgArtUrl) return;
    lastBgArtUrl = url; els.bg.style.backgroundImage = 'url("' + url + '")';
  }

  /* Dubbeltik-herkenning (eigen, want "dblclick" werkt niet betrouwbaar op een
     touchscreen in het dashboard). Eerste tik: regel licht kort op. Tweede tik
     op dezelfde regel binnen 0,4 s = dubbeltik (afspelen). Een enkele tik doet
     na 0,4 s alleen iets als daar een actie voor is (bijv. album openen). */
  var DOUBLE_TAP_MS = 400;
  var lastTap = { key: null, timer: null, row: null };
  function handleTap(key, row, onSingle, onDouble){
    if(lastTap.key === key){
      clearTimeout(lastTap.timer);
      if(lastTap.row) lastTap.row.classList.remove("tapped");
      lastTap = { key: null, timer: null, row: null };
      if(onDouble) onDouble();
      return;
    }
    clearTimeout(lastTap.timer);
    if(lastTap.row) lastTap.row.classList.remove("tapped");
    if(row) row.classList.add("tapped");
    lastTap = { key: key, row: row, timer: setTimeout(function(){
      if(row) row.classList.remove("tapped");
      lastTap = { key: null, timer: null, row: null };
      if(onSingle) onSingle();
    }, DOUBLE_TAP_MS) };
  }
  // Tekst na toevoegen, bijv. "8 nummers toegevoegd aan Ramon, 2 stonden er al in".
  function addResultText(r, name){
    var a = r.added || 0, sk = r.skipped || 0;
    var n = function(x){ return x === 1 ? "1 nummer" : x + " nummers"; };
    if(a === 0 && sk > 0) return sk === 1 ? "Staat al in " + name : "Alle " + sk + " nummers staan al in " + name;
    return n(a) + " toegevoegd aan " + name + (sk ? ", " + sk + (sk === 1 ? " stond" : " stonden") + " er al in" : "");
  }

  /* ======================= Weergave ======================= */
  var heroRelease = null, moreReleases = [], gridAlbums = [];
  var EQ = '<span class="eq"><i></i><i></i><i></i></span>';

  function isPlayingRelease(r){
    return !!playingAlbumId && !!r.albumId && r.albumId === playingAlbumId;
  }

  function render(){
    var rel = (P && P.releases) || [];
    // Widget-instellingen: aantal regels bij "Ook nieuw" en "Onlangs gedraaid".
    var moreN = WS.more_count != null && WS.more_count !== "" ? Math.max(0, Math.min(10, Number(WS.more_count) || 0)) : 3;
    var recentN = WS.recent_count != null && WS.recent_count !== "" ? Math.max(0, Math.min(20, Number(WS.recent_count) || 0)) : 8;
    heroRelease = rel[0] || null;
    moreReleases = rel.slice(1, 1 + moreN);
    gridAlbums = ((P && P.recent) || []).slice(0, recentN);
    els.grid.parentNode.style.display = recentN === 0 ? "none" : "";

    if(heroRelease){
      var tag = releaseTag(heroRelease);
      els.heroBox.innerHTML =
        '<div class="hero' + (isPlayingRelease(heroRelease) ? " playing" : "") + '" data-kind="release" data-i="0">' +
          '<div class="heroArt" style="background-image:url(\'' + cssUrl(heroRelease.image) + '\')">' +
            (tag ? '<span class="heroTag ' + tag.cls + '">' + tag.text + '</span>' : '') +
            EQ +
            '<button class="heroAdd" data-add="1" aria-label="Toevoegen aan playlist">＋</button>' +
            '<button class="heroPlay" data-play="1" aria-label="Afspelen">▶</button>' +
          '</div>' +
          '<div class="heroName">' + esc(heroRelease.name) + '</div>' +
          '<div class="heroMeta">' + esc(heroRelease.artist) + ' · ' + esc(fmtDate(heroRelease.date)) + '</div>' +
        '</div>';
    }else{
      els.heroBox.innerHTML = '<div class="empty" style="margin-top:.8em">Het nieuwste album van elke artiest die je draait verschijnt hier vanzelf, meestal binnen een minuut.</div>';
    }

    els.moreBox.innerHTML = moreReleases.length ? '<div class="sectionTitle">Ook nieuw</div>' + moreReleases.map(function(r, i){
      var tag = releaseTag(r);
      return '<div class="row' + (isPlayingRelease(r) ? " playing" : "") + '" data-kind="release" data-i="' + (i + 1) + '">' +
        '<div class="rowArt" style="background-image:url(\'' + cssUrl(r.image) + '\')"></div>' +
        '<div class="rowInfo">' +
          '<div class="rowName">' + esc(r.name) + (tag ? '<span class="badge ' + tag.cls + '">' + tag.text + '</span>' : '') + '</div>' +
          '<div class="rowMeta">' + esc(r.artist) + ' · ' + esc(fmtDate(r.date)) + '</div>' +
        '</div>' + EQ + '<button class="addBtn" data-add="1" aria-label="Toevoegen aan playlist">＋</button></div>';
    }).join("") : "";

    els.grid.innerHTML = gridAlbums.length ? gridAlbums.map(function(h, i){
      return '<div class="row' + (h.albumId === playingAlbumId ? " playing" : "") + '" data-kind="recent" data-i="' + i + '">' +
        '<div class="rowArt" style="background-image:url(\'' + cssUrl(h.image) + '\')"></div>' +
        '<div class="rowInfo">' +
          '<div class="rowName">' + esc(h.album) + '</div>' +
          '<div class="rowMeta">' + esc(h.artist) + ' · ' + esc(agoText(h.t)) + '</div>' +
        '</div>' + EQ + '<button class="addBtn" data-add="1" aria-label="Toevoegen aan playlist">＋</button></div>';
    }).join("") : '<div class="empty">Nog niets gedraaid.</div>';

    var n = P ? P.followed : 0, todo = P ? P.todo : 0;
    els.subtitle.textContent = (P && P.error) ||
      (!n ? "Nieuw van je artiesten"
       : "Nieuw van " + n + " " + (n === 1 ? "artiest" : "artiesten") + " die je draait" + (todo ? " · " + todo + " nog opzoeken…" : ""));
    markTracks();
    renderStatus();
  }

  document.addEventListener("click", function(e){
    var box = e.target.closest("[data-kind]");
    if(!box || els.detail.contains(box)) return;
    var i = +box.getAttribute("data-i");
    // ＋ = album toevoegen; ▶ = meteen afspelen; enkele tik = openen; dubbeltik = afspelen.
    var target, title, key;
    if(box.getAttribute("data-kind") === "release"){
      var r = i === 0 ? heroRelease : moreReleases[i - 1];
      if(!r) return;
      target = { release: r, title: r.name, albumId: r.albumId || null }; title = r.name; key = "rel:" + r.rgid;
      if(e.target.closest("[data-play]")){ play(target, null); return; }
      if(e.target.closest("[data-add]")){ addAlbum(target, title); return; }
      handleTap(key, box, function(){ openDetail({ release: r }); }, function(){ play(target, null); });
    }else{
      var h = gridAlbums[i]; if(!h) return;
      target = { albumId: h.albumId, title: h.album }; key = "rec:" + h.albumId;
      if(e.target.closest("[data-add]")){ addAlbum(target, h.album); return; }
      handleTap(key, box, function(){ openDetail({ recent: h }); }, function(){ play(target, null); });
    }
  });

  /* ======================= Spotify — alleen bij een tik (via de app) ======================= */
  function albumIdFor(target){
    if(target.albumId) return Promise.resolve(target.albumId);
    var r = target.release;
    if(r && r.albumId) return Promise.resolve(r.albumId);
    return HAPI.api("POST", "/resolve", { release: r }).then(function(res){
      if(!res || !res.ok) throw new Error((res && res.error) || "Album niet gevonden");
      if(r) r.albumId = res.albumId;
      return res.albumId;
    });
  }
  var trackCache = {};
  function albumTracks(albumId){
    if(trackCache[albumId]) return Promise.resolve(trackCache[albumId]);
    return HAPI.api("POST", "/album", { albumId: albumId }).then(function(res){
      if(!res || !res.ok) throw new Error((res && res.error) || "Album ophalen mislukt");
      trackCache[albumId] = res.tracks || [];
      return trackCache[albumId];
    });
  }

  /* ---------- Detail ---------- */
  var open = null; // { title, artist, date, image, albumId?, release? }

  function openDetail(o){
    var release = o.release, recent = o.recent;
    open = release
      ? { title: release.name, artist: release.artist, date: release.date, image: release.image, release: release, albumId: release.albumId || null }
      : { title: recent.album, artist: recent.artist, date: recent.albumDate, image: recent.image, albumId: recent.albumId };
    var me = open;
    els.detailArt.style.backgroundImage = "url('" + cssUrl(me.image) + "')";
    els.detailType.textContent = release ? "Nieuw album" : "Onlangs gedraaid";
    els.detailName.textContent = me.title;
    els.detailMeta.textContent = [me.artist, fmtDate(me.date)].filter(Boolean).join(" · ");
    els.trackList.innerHTML = '<div class="msg">Nummers laden…</div>';
    els.trackList.scrollTop = 0;
    els.detail.classList.add("open");
    albumIdFor(me).then(function(id){
      me.albumId = id;
      return albumTracks(id);
    }).then(function(tracks){
      if(open !== me) return;
      els.trackList.innerHTML = tracks.map(function(t){
        var artists = (t.artists || []).join(", ");
        var ms = t.duration_ms || 0;
        return '<div class="trackRow" data-id="' + esc(t.id) + '" data-uri="' + esc(t.uri) + '">' +
          '<div class="trackNum">' + (t.track_number || "") + '</div>' +
          '<div class="trackInfo"><div class="trackName">' + esc(t.name) + '</div>' +
            (artists && artists !== me.artist ? '<div class="trackArtists">' + esc(artists) + '</div>' : '') + '</div>' +
          '<div class="trackDur">' + Math.floor(ms / 60000) + ':' + String(Math.round(ms / 1000) % 60).padStart(2, "0") + '</div>' +
          '<button class="addBtn" aria-label="Toevoegen">＋</button>' +
        '</div>';
      }).join("") || '<div class="msg">Geen nummers gevonden.</div>';
      markTracks();
    }).catch(function(err){
      if(open === me) els.trackList.innerHTML = '<div class="msg">' + esc(err.message || String(err)) + '</div>';
    });
  }
  function markTracks(){
    Array.prototype.forEach.call(els.trackList.querySelectorAll(".trackRow"), function(r){
      r.classList.toggle("playing", !!playingTrackId && r.getAttribute("data-id") === playingTrackId);
    });
  }
  els.detailBack.addEventListener("click", function(){ open = null; els.detail.classList.remove("open"); });
  els.detailPlay.addEventListener("click", function(){ if(open) play(open, null); });
  els.detailAdd.addEventListener("click", function(){
    if(!open) return;
    var me = open;
    addAlbum(me, me.title);
  });
  els.trackList.addEventListener("click", function(e){
    var row = e.target.closest(".trackRow"); if(!row || !open) return;
    if(e.target.closest(".addBtn")){ openPicker([row.getAttribute("data-uri")], "<b>" + esc(row.querySelector(".trackName").textContent) + "</b> toevoegen aan…"); return; }
    var me = open, uri = row.getAttribute("data-uri");
    handleTap("tr:" + uri, row, null, function(){ play(me, uri); });
  });

  /* ---------- Afspelen (Denon wordt zo nodig gewekt, TV blijft zoals hij is) ---------- */
  var playBusy = false;
  function play(target, trackUri){
    if(playBusy) return; playBusy = true;
    toast("▶ Starten…");
    albumIdFor(target).then(function(id){
      target.albumId = id;
      var extra = { albumUri: "spotify:album:" + id };
      if(trackUri) extra.trackUri = trackUri;
      return send("playAlbum", extra);
    }).then(function(r){
      if(r && r.ok === false) toast(r.error || "Afspelen mislukt", true);
      else toast("▶ Speelt af");
    }).catch(function(err){ toast(err.message || String(err), true); })
      .then(function(){ playBusy = false; });
  }

  /* ---------- Toevoegen (knoppen uit de app-instellingen) ---------- */
  var pickerUris = null, pickerAlbumId = null;
  // Heel album toevoegen: eerst (1x) het Spotify-album zoeken, dan de kiezer.
  function addAlbum(target, title){
    albumIdFor(target).then(function(id){
      target.albumId = id;
      openPicker(null, "Album <b>" + esc(title) + "</b> toevoegen aan…", id);
    }).catch(function(err){ toast(err.message || String(err), true); });
  }
  function targetPlaylists(){
    return ((S && S.config && S.config.playlists) || []).filter(function(p){ return p && p.name && p.uri; });
  }
  function openPicker(uris, title, albumId){
    pickerUris = uris; pickerAlbumId = albumId || null; els.sheetTitle.innerHTML = title;
    var lists = targetPlaylists();
    els.sheetGrid.innerHTML = lists.length
      ? lists.map(function(p, i){ return '<button class="btn" data-i="' + i + '">' + esc(p.name) + '</button>'; }).join("")
      : '<div class="msg">Geen afspeellijsten ingesteld (app-instellingen, onderdeel 3).</div>';
    els.sheetBackdrop.classList.add("open");
  }
  function closePicker(){ pickerUris = null; pickerAlbumId = null; els.sheetBackdrop.classList.remove("open"); }
  els.sheetCancel.addEventListener("click", closePicker);
  els.sheetBackdrop.addEventListener("click", function(e){ if(e.target === els.sheetBackdrop) closePicker(); });
  els.sheetGrid.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b || (!pickerUris && !pickerAlbumId)) return;
    var p = targetPlaylists()[+b.getAttribute("data-i")], uris = pickerUris, albumId = pickerAlbumId; closePicker();
    if(!p) return;
    toast("Toevoegen…");
    var req = albumId
      ? send("addAlbumToPlaylist", { playlistUri: p.uri, albumId: albumId })
      : send("addToPlaylist", { playlistUri: p.uri, uris: uris });
    req.then(function(r){
      if(!r || r.ok === false){ toast((r && r.error) || "Toevoegen mislukt", true); return; }
      toast(addResultText(r, p.name));
    });
  });

  /* ======================= Verbinding met de app ======================= */
  function applyState(s){
    if(!s) return;
    S = s;
    receivedAt = Date.now();
    applyHeight(s.config);
    if(s.track && s.track.artUrl) updateBackground(s.track.artUrl);
    var a = (s.track && s.isPlaying && s.track.albumInfo) ? s.track.albumInfo.id : null;
    var t = (s.track && s.isPlaying) ? s.track.id : null;
    if(a !== playingAlbumId || t !== playingTrackId){ playingAlbumId = a; playingTrackId = t; render(); }
    else renderStatus();
  }
  function applyPlatenkast(p){
    if(!p) return;
    P = p;
    render();
  }
  function fetchState(){
    if(!HAPI) return;
    HAPI.api("GET", "/state").then(applyState).catch(function(err){
      flashError("Geen verbinding met de app: " + (err && err.message || err));
    });
  }
  function fetchPlatenkast(){
    if(!HAPI) return;
    HAPI.api("POST", "/platenkast", {}).then(applyPlatenkast).catch(function(){});
  }

  // Vangnet tegen een "bevroren" webview — niet terwijl er iets openstaat.
  setInterval(function(){
    if(document.visibilityState !== "visible" || !receivedAt || Date.now() - receivedAt < 180000) return;
    if(els.detail.classList.contains("open") || els.sheetBackdrop.classList.contains("open")) return;
    location.reload();
  }, 30000);
  // Elke 30 s: status ophalen (lokaal) = "ik ben in beeld"; elke 5 min ook de lijst (vangnet naast realtime).
  setInterval(function(){ if(document.visibilityState === "visible") fetchState(); }, 30000);
  setInterval(function(){ if(document.visibilityState === "visible") fetchPlatenkast(); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ fetchState(); fetchPlatenkast(); }
  });

  render();

  window.onHomeyReady = function(Homey){
    HAPI = Homey;
    try{ WS = Homey.getSettings() || {}; debugOn = !!WS.debug; }catch(e){}
    updatePanorama();
    render();
    Homey.on("state", applyState);
    Homey.on("platenkast", applyPlatenkast);
    var readyDone = false;
    function ready(cfg){
      if(readyDone) return;
      readyDone = true;
      currentHeight = computeHeight(cfg);
      Homey.ready({ height: currentHeight });
      setTimeout(updatePanorama, 50);
    }
    Homey.api("GET", "/state")
      .then(function(s){ ready(s && s.config); applyState(s); })
      .catch(function(err){ ready(null); flashError("Geen verbinding met de app: " + (err && err.message || err)); });
    fetchPlatenkast();
    setTimeout(function(){ ready(null); }, 4000);
  };
})();
</script>
</body>
</html>
