<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Afspeellijst</title>
<style>
  :root{ --panorama-width:1280px; --panorama-height:420px; --panorama-offset:-320px; }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#0b0d0f;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    color:#fff;
  }
  .wrap{
    position:relative;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .bg{
    position:absolute; inset:-20px;
    background-repeat:no-repeat;
    background-size:var(--panorama-width) var(--panorama-height);
    background-position:var(--panorama-offset) center;
    filter:blur(10px) brightness(.55);
    transform:scale(1.15);
    transition:background-image 250ms ease, background-position 250ms ease;
    z-index:0;
  }
  .header, .list{
    position:relative;
    z-index:1;
  }
  .header{
    display:flex; align-items:center; gap:.8em;
    padding:1em 1.2em .6em 1.2em;
    flex-shrink:0;
  }
  .headerArt{
    width:48px; height:48px;
    border-radius:8px;
    background-size:cover; background-position:center;
    background-color:#222;
    flex-shrink:0;
    box-shadow:0 8px 16px rgba(0,0,0,.4);
  }
  .headerText{ min-width:0; flex:1; }
  .headerLabel{
    font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    opacity:.6; margin-bottom:.15em;
  }
  .headerTitle{
    font-size:clamp(15px,3.6vw,20px); font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* Scrollen binnen de lijst: de tegel is nooit hoger dan het scherm (hoogte
     uit de app-instellingen), en scrollen "lekt" niet door naar het dashboard. */
  .list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:0 .6em 1em .6em;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    touch-action:pan-y;
  }
  .list::-webkit-scrollbar{ width:4px; }
  .list::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.2); border-radius:4px; }
  .track{
    display:flex; align-items:center; gap:.7em;
    padding:.55em .6em;
    border-radius:10px;
    cursor:pointer;
    transition:background 150ms ease;
  }
  .track.pressed{ background:rgba(255,255,255,.08); }
  .trackIndex{
    width:1.6em; text-align:right; flex-shrink:0;
    font-size:13px; opacity:.4; font-variant-numeric:tabular-nums;
  }
  .trackInfo{ min-width:0; flex:1; }
  .trackName{
    font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:#fff;
  }
  .trackArtist{
    font-size:12px; opacity:.6;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track.active{ background:rgba(29,185,84,.12); }
  .track.active .trackName{ color:#1DB954; }
  .track.active .trackArtist{ color:#1ed760; opacity:.85; }
  .trackIndex .indexNum{ display:block; }
  .trackIndex .eq{
    display:none;
    align-items:flex-end;
    justify-content:center;
    gap:2px;
    height:14px;
    margin:0 auto;
  }
  .trackIndex .eq span{
    width:3px;
    background:#1DB954;
    border-radius:1px;
    animation:eq-bounce 0.9s ease-in-out infinite;
  }
  .trackIndex .eq span:nth-child(1){ animation-delay:0s; }
  .trackIndex .eq span:nth-child(2){ animation-delay:0.2s; }
  .trackIndex .eq span:nth-child(3){ animation-delay:0.4s; }
  @keyframes eq-bounce{
    0%, 100%{ height:3px; }
    50%{ height:14px; }
  }
  .track.active .indexNum{ display:none; }
  .track.active .eq{ display:flex; }
  .list.paused .eq span{ animation-play-state:paused; height:5px; }
  .message{
    display:flex; align-items:center; justify-content:center;
    height:100%; text-align:center; padding:2em;
    font-size:14px; opacity:.6; line-height:1.5;
  }
  .message small{ display:block; opacity:.7; font-size:12px; margin-top:.4em; }
  /* ---------- ＋-knop, playlist-kiezer en meldingen (zelfde stijl als Aura) ---------- */
  .addBtn{
    width:32px; height:32px; border-radius:50%;
    border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff;
    font-size:18px; line-height:1; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .addBtn:active{ background:rgba(255,255,255,.15); }
  .pkBtn{
    border:0; border-radius:10px; font:inherit; font-size:14px; font-weight:600;
    padding:.85em .5em; color:#fff; background:rgba(255,255,255,.12); cursor:pointer;
  }
  .pkBtn:active{ transform:scale(.96); }
  .sheetBackdrop{ position:absolute; inset:0; z-index:30; background:rgba(0,0,0,.55); display:none; align-items:flex-end; }
  .sheetBackdrop.open{ display:flex; }
  .sheet{ width:100%; background:#16191c; border-radius:16px 16px 0 0; padding:1em 1em 1.3em 1em; box-shadow:0 -10px 30px rgba(0,0,0,.5); color:#fff; }
  .sheetTitle{ font-size:13px; opacity:.7; margin-bottom:.8em; line-height:1.4; }
  .sheetTitle b{ color:#fff; }
  .sheetGrid{ display:grid; grid-template-columns:1fr 1fr; gap:.5em; }
  .sheet .cancel{ width:100%; margin-top:.6em; background:transparent; opacity:.7; }
  .toast{
    position:absolute; left:50%; bottom:1.2em; z-index:40; transform:translate(-50%, 20px);
    background:rgba(20,22,25,.95); color:#fff; border-radius:999px; padding:.6em 1.1em;
    font-size:13px; max-width:90%; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity 200ms ease, transform 200ms ease;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .toast.error{ background:#B3452F; }
  .track.tapped{ background:rgba(255,255,255,.1); }
  .track .addBtn{ margin-left:.2em; opacity:.55; }
  .track.active .addBtn{ opacity:1; }
  .errorBox{
    position:fixed; left:0; right:0; bottom:0;
    background:#B3452F; color:#fff; font-size:12px;
    padding:.6em 1em; z-index:9999; word-break:break-word;
    display:none;
  }
  .diag{
    position:absolute; left:0; right:0; top:0; z-index:9998; display:none;
    background:rgba(0,0,0,.8); color:#9f9; font:11px monospace; padding:4px 8px;
    pointer-events:none; white-space:pre-wrap;
  }
</style>
</head>
<body class="homey-widget-full">

<div class="wrap">
  <div class="bg" id="bg"></div>
  <div class="header" id="header" style="display:none;">
    <div class="headerArt" id="headerArt"></div>
    <div class="headerText">
      <div class="headerLabel">Afspeellijst</div>
      <div class="headerTitle" id="headerTitle">Laden…</div>
    </div>
  </div>
  <div class="list" id="list">
    <div class="message">Wachten op afspeeldata…</div>
  </div>
  <div class="sheetBackdrop" id="sheetBackdrop">
    <div class="sheet">
      <div class="sheetTitle" id="sheetTitle"></div>
      <div class="sheetGrid" id="sheetGrid"></div>
      <button class="pkBtn cancel" id="sheetCancel">Annuleren</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<div class="diag" id="diag"></div>
<div class="errorBox" id="errorBox"></div>

<script>
/* ==========================================================================
   Widget "Afspeellijst" — toont de tracklijst van de afspeellijst die nu
   speelt, met het huidige nummer groen uitgelicht (bewegende equalizer,
   bevriest bij pauze). Tik op een nummer = die lijst vanaf dat nummer spelen.

   Alle Spotify-verkeer loopt via de app op de Homey. De widget krijgt de
   afspeelstatus live (Homey.on('state')) en vraagt de tracklijst alleen op
   als de afspeellijst in die status anders is dan wat hij toont. De app
   bewaart de lijst, dus opnieuw laden kost geen Spotify-verzoeken.
   ========================================================================== */
(function(){
  var H = null;
  var S = null;                 // laatste status van de app
  var receivedAt = 0;
  var currentHeight = 0;
  var debugOn = false;
  var WS = {};                  // widget-instellingen

  var shown = { uri: null, loadedAt: 0, count: 0 }; // lijst die nu op het scherm staat
  var rowsById = {};            // trackId -> rij (bij dubbele nummers: de eerste)
  var currentTrackId = null;
  var pending = { key: "", at: 0 };
  var userScrollAt = 0;         // laatst zelf gescrold: dan niet automatisch meescrollen
  var lastTapAt = 0;

  var PANEL_INDEX = 1;          // Afspeellijst = kwart 2 van het panorama
  var PANEL_COUNT = 4;
  var AUTO_SCROLL_PAUSE_MS = 10000;

  var $ = function(id){ return document.getElementById(id); };
  var els = {
    bg: $("bg"), header: $("header"), headerArt: $("headerArt"), headerTitle: $("headerTitle"),
    list: $("list"), errorBox: $("errorBox"), diag: $("diag")
  };
  var root = document.documentElement;

  /* ---------------- hoogte (zelfde als "Nu speelt") ---------------- */
  function isLandscape(){
    try{
      if(screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf("landscape") === 0;
    }catch(e){}
    if(typeof window.orientation === "number") return Math.abs(window.orientation) === 90;
    return screen.width > screen.height;
  }
  function computeBaseHeight(cfg){
    cfg = cfg || {};
    if(cfg.heightMode === "fixed" && cfg.heightFixed > 0) return Math.round(cfg.heightFixed);
    var sw = screen.width || 0, sh = screen.height || 0;
    var land = isLandscape();
    var screenH = land ? Math.min(sw, sh) : Math.max(sw, sh);
    var margin = land ? (cfg.marginLandscape != null ? cfg.marginLandscape : 140)
                      : (cfg.marginPortrait != null ? cfg.marginPortrait : 180);
    return Math.max(300, Math.round(screenH - margin));
  }
  /* Eigen hoogte per widget (widget-instelling "Hoogte"): standaard de volledige
     hoogte uit de app-instellingen, of een percentage daarvan. */
  function computeHeight(cfg){
    var h = computeBaseHeight(cfg);
    if(WS.height_mode === "percent"){
      var p = Number(WS.height_percent);
      if(!(p > 0)) p = 60;
      p = Math.max(20, Math.min(100, p));
      h = Math.max(200, Math.round(h * p / 100));
    }
    return h;
  }
  function applyHeight(cfg){
    var h = computeHeight(cfg);
    if(h === currentHeight) return;
    currentHeight = h;
    if(H) H.setHeight(h).catch(function(){});
  }
  // Achtergrond: standaard het eigen kwart van de hoes, of (widget-instelling
  // "Achtergrond") een ander kwart of de hele hoes.
  function updatePanorama(){
    var w = root.clientWidth, h = root.clientHeight;
    if(!w || !h) return;
    var bgEl = document.getElementById("bg");
    if(WS.panorama === "whole"){
      bgEl.style.backgroundSize = "cover";
      bgEl.style.backgroundPosition = "center";
      return;
    }
    bgEl.style.backgroundSize = "";
    bgEl.style.backgroundPosition = "";
    var idx = /^[1-4]$/.test(String(WS.panorama)) ? Number(WS.panorama) - 1 : PANEL_INDEX;
    root.style.setProperty("--panorama-width", (w * PANEL_COUNT) + "px");
    root.style.setProperty("--panorama-height", h + "px");
    root.style.setProperty("--panorama-offset", (-idx * w) + "px");
  }
  updatePanorama();
  window.addEventListener("resize", updatePanorama);
  if(window.ResizeObserver) new ResizeObserver(updatePanorama).observe(root);
  function onOrientation(){ setTimeout(function(){ applyHeight(S && S.config); updatePanorama(); }, 300); }
  window.addEventListener("orientationchange", onOrientation);
  try{ screen.orientation.addEventListener("change", onOrientation); }catch(e){}

  /* ---------------- hulpjes ---------------- */
  function isPlaylistUri(uri){ return /^spotify:playlist:[A-Za-z0-9]+$/.test(uri || ""); }
  function haptic(){ try{ H && H.hapticFeedback(); }catch(e){} }

  var flashMsg = "", flashUntil = 0;
  function flashError(msg){ flashMsg = msg; flashUntil = Date.now() + 6000; renderStatus(); setTimeout(renderStatus, 6100); }

  function renderStatus(){
    var msg = "";
    if(Date.now() < flashUntil) msg = flashMsg;
    else if(S){
      var st = S.status || {};
      if(st.spotify === "no-login" || st.spotify === "error" || st.spotify === "blocked") msg = st.spotifyMsg;
      else if(st.playlistScope === false) msg = "Log opnieuw in bij Spotify (app-instellingen): de afspeellijst heeft nieuwe rechten nodig.";
    }
    els.errorBox.textContent = msg || "";
    els.errorBox.style.display = msg ? "block" : "none";
    if(debugOn && S){
      var st2 = S.status || {};
      els.diag.style.display = "block";
      els.diag.textContent = "Modus: " + st2.mode + " | Spotify: " + st2.spotify +
        " | verzoeken afgelopen uur: " + st2.requestsLastHour +
        " | lijst: " + (shown.uri ? shown.count + " nummers, geladen " + new Date(shown.loadedAt).toLocaleTimeString("nl-NL") : "—") +
        " | hoogte: " + currentHeight + "px";
    }
  }

  function send(action, extra){
    if(!H) return Promise.resolve();
    var body = { action: action };
    if(extra) for(var k in extra) body[k] = extra[k];
    return H.api("POST", "/command", body).then(function(r){
      if(r && r.ok === false && r.error) flashError(r.error);
      return r;
    }).catch(function(err){ flashError("Opdracht mislukt: " + (err && err.message || err)); });
  }

  /* ---------------- weergave ---------------- */
  var lastBgArtUrl = null;
  function updateBackground(artUrl){
    if(!artUrl || artUrl === lastBgArtUrl) return;
    lastBgArtUrl = artUrl;
    els.bg.style.backgroundImage = 'url("' + artUrl + '")';
  }

  function showMessage(text, sub){
    els.header.style.display = "none";
    els.list.innerHTML = "";
    var d = document.createElement("div");
    d.className = "message";
    var inner = document.createElement("div");
    inner.textContent = text;
    if(sub){ var s = document.createElement("small"); s.textContent = sub; inner.appendChild(s); }
    d.appendChild(inner);
    els.list.appendChild(d);
    shown = { uri: null, loadedAt: 0, count: 0 };
    rowsById = {};
    currentTrackId = null;
  }

  function renderPlaylist(p){
    rowsById = {};
    currentTrackId = null;
    shown = { uri: p.uri, loadedAt: p.loadedAt || 0, count: (p.tracks || []).length };
    els.header.style.display = "flex";
    els.headerTitle.textContent = p.name || "Afspeellijst";
    els.headerArt.style.backgroundImage = p.artUrl ? 'url("' + p.artUrl + '")' : "none";

    var tracks = p.tracks || [];
    if(!tracks.length){
      els.list.innerHTML = '<div class="message">Deze afspeellijst is leeg.</div>';
      return;
    }
    var frag = document.createDocumentFragment();
    tracks.forEach(function(t, idx){
      var row = document.createElement("div");
      row.className = "track";
      row.setAttribute("data-track-id", t.id);
      row.setAttribute("data-track-uri", t.uri);

      var index = document.createElement("div");
      index.className = "trackIndex";
      index.innerHTML = '<span class="indexNum"></span><span class="eq"><span></span><span></span><span></span></span>';
      index.firstChild.textContent = String(idx + 1);

      var info = document.createElement("div");
      info.className = "trackInfo";
      var name = document.createElement("div");
      name.className = "trackName";
      name.textContent = t.name || "";
      var artist = document.createElement("div");
      artist.className = "trackArtist";
      artist.textContent = t.artist || "";
      info.appendChild(name);
      info.appendChild(artist);

      var add = document.createElement("button");
      add.className = "addBtn";
      add.setAttribute("aria-label", "Toevoegen aan playlist");
      add.textContent = "＋";

      row.appendChild(index);
      row.appendChild(info);
      row.appendChild(add);
      if(!rowsById[t.id]) rowsById[t.id] = row; // dubbel nummer: alleen de eerste licht op
      frag.appendChild(row);
    });
    els.list.innerHTML = "";
    els.list.scrollTop = 0;
    els.list.appendChild(frag);
  }

  // Alleen de lijst zelf scrollen (geen scrollIntoView: dat kan ook het
  // dashboard eromheen laten verschuiven).
  function scrollToRow(row, smooth){
    if(!row || WS.auto_scroll === false) return;
    if(Date.now() - userScrollAt < AUTO_SCROLL_PAUSE_MS) return;
    var list = els.list;
    var top = row.offsetTop - (list.clientHeight / 2) + (row.offsetHeight / 2);
    top = Math.max(0, Math.min(top, list.scrollHeight - list.clientHeight));
    try{ list.scrollTo({ top: top, behavior: smooth ? "smooth" : "auto" }); }
    catch(e){ list.scrollTop = top; }
  }

  function highlightTrack(trackId, opts){
    opts = opts || {};
    if(trackId === currentTrackId && !opts.force) return;
    var prev = currentTrackId && rowsById[currentTrackId];
    if(prev) prev.classList.remove("active");
    currentTrackId = trackId || null;
    var row = trackId && rowsById[trackId];
    if(row){
      row.classList.add("active");
      if(opts.scroll !== false) scrollToRow(row, opts.smooth !== false);
    }
  }

  /* ---------------- tracklijst van de app ---------------- */
  function wantedUri(){
    return S && isPlaylistUri(S.contextUri) ? S.contextUri : null;
  }

  function requestPlaylist(uri, trackId){
    if(!H) return;
    var key = (uri || "") + "|" + (trackId || "");
    if(pending.key === key && Date.now() - pending.at < 20000) return; // net al gevraagd
    pending = { key: key, at: Date.now() };
    var body = {};
    if(uri) body.uri = uri;
    if(trackId) body.trackId = trackId;
    H.api("POST", "/playlist", body).then(applyPlaylist).catch(function(err){
      pending = { key: "", at: 0 };
      flashError("Afspeellijst opvragen mislukt: " + (err && err.message || err));
    });
  }

  function applyPlaylist(p){
    if(!p) return;
    var want = wantedUri();
    // Antwoord voor een andere lijst dan die nu speelt: negeren.
    if(want && p.uri && p.uri !== want) return;

    if(p.notPlaylist) return;
    if(p.loading){
      if(p.uri !== shown.uri) showMessage("Afspeellijst laden…");
      return;
    }
    if(p.error){
      if(p.uri !== shown.uri) showMessage("Kon afspeellijst niet laden.", p.error);
      else flashError(p.error);
      return;
    }
    if(!p.tracks) return; // app heeft (nog) niets bewaard
    var isNew = p.uri !== shown.uri;
    if(isNew || (p.loadedAt || 0) !== shown.loadedAt){
      renderPlaylist(p);
      var id = S && S.track ? S.track.id : currentTrackId;
      highlightTrack(id, { force: true, smooth: false, scroll: true });
      renderStatus();
    }
  }

  /* ---------------- status van de app ---------------- */
  function applyState(s){
    if(!s) return;
    S = s;
    receivedAt = Date.now();
    applyHeight(s.config);

    els.list.classList.toggle("paused", !s.isPlaying);
    if(s.track && s.track.artUrl) updateBackground(s.track.artUrl);

    var ctx = s.contextUri;
    var trackId = s.track ? s.track.id : null;

    if(isPlaylistUri(ctx)){
      if(ctx !== shown.uri){
        requestPlaylist(ctx, trackId);
      }else{
        if(trackId && !rowsById[trackId]) requestPlaylist(ctx, trackId); // lijst bewerkt?
        highlightTrack(trackId);
      }
    }else if(ctx){
      // Er speelt iets zonder afspeellijst (album, artiest, los nummer).
      if(shown.uri || !els.list.querySelector(".message.noPlaylist")){
        showMessage("Er speelt geen afspeellijst (bijv. een los nummer of album).");
        els.list.firstChild.classList.add("noPlaylist");
      }
    }else{
      // Niets speelt / gestopt: de laatst getoonde lijst gewoon laten staan.
      if(shown.uri) highlightTrack(trackId, { smooth: false });
    }
    renderStatus();
  }

  /* Dubbeltik-herkenning (eigen, want "dblclick" werkt niet betrouwbaar op een
     touchscreen in het dashboard). Eerste tik: regel licht kort op. Tweede tik
     op dezelfde regel binnen 0,4 s = dubbeltik (afspelen). Een enkele tik doet
     na 0,4 s alleen iets als daar een actie voor is (bijv. album openen). */
  var DOUBLE_TAP_MS = 400;
  var lastTap = { key: null, timer: null, row: null };
  function handleTap(key, row, onSingle, onDouble){
    if(lastTap.key === key){
      clearTimeout(lastTap.timer);
      if(lastTap.row) lastTap.row.classList.remove("tapped");
      lastTap = { key: null, timer: null, row: null };
      if(onDouble) onDouble();
      return;
    }
    clearTimeout(lastTap.timer);
    if(lastTap.row) lastTap.row.classList.remove("tapped");
    if(row) row.classList.add("tapped");
    lastTap = { key: key, row: row, timer: setTimeout(function(){
      if(row) row.classList.remove("tapped");
      lastTap = { key: null, timer: null, row: null };
      if(onSingle) onSingle();
    }, DOUBLE_TAP_MS) };
  }
  // Tekst na toevoegen, bijv. "8 nummers toegevoegd aan Ramon, 2 stonden er al in".
  function addResultText(r, name){
    var a = r.added || 0, sk = r.skipped || 0;
    var n = function(x){ return x === 1 ? "1 nummer" : x + " nummers"; };
    if(a === 0 && sk > 0) return sk === 1 ? "Staat al in " + name : "Alle " + sk + " nummers staan al in " + name;
    return n(a) + " toegevoegd aan " + name + (sk ? ", " + sk + (sk === 1 ? " stond" : " stonden") + " er al in" : "");
  }
  /* ---------- Toevoegen aan een afspeellijst (knoppen uit de app-instellingen) ---------- */
  var pk = {
    backdrop: document.getElementById("sheetBackdrop"), title: document.getElementById("sheetTitle"),
    grid: document.getElementById("sheetGrid"), cancel: document.getElementById("sheetCancel"),
    toast: document.getElementById("toast"), uris: null, toastTimer: null
  };
  function toast(m, err){
    pk.toast.textContent = m; pk.toast.classList.toggle("error", !!err); pk.toast.classList.add("show");
    clearTimeout(pk.toastTimer); pk.toastTimer = setTimeout(function(){ pk.toast.classList.remove("show"); }, err ? 4500 : 2500);
  }
  function targetPlaylists(){
    return ((S && S.config && S.config.playlists) || []).filter(function(p){ return p && p.name && p.uri; });
  }
  function escTxt(s){ var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
  function openPicker(uris, titleHtml){
    pk.uris = uris;
    pk.title.innerHTML = titleHtml;
    var lists = targetPlaylists();
    pk.grid.innerHTML = lists.length
      ? lists.map(function(p, i){ return '<button class="pkBtn" data-i="' + i + '">' + escTxt(p.name) + '</button>'; }).join("")
      : '<div style="opacity:.6;font-size:13px">Geen afspeellijsten ingesteld (app-instellingen, onderdeel 3).</div>';
    pk.backdrop.classList.add("open");
    pk.openedAt = Date.now();
  }
  function closePicker(){ pk.uris = null; pk.backdrop.classList.remove("open"); }
  pk.cancel.addEventListener("click", closePicker);
  // De tik die de kiezer opende mag hem niet meteen weer sluiten of een lijst kiezen.
  var pickerJustOpened = function(){ return Date.now() - (pk.openedAt || 0) < 450; };
  pk.backdrop.addEventListener("click", function(e){ if(e.target === pk.backdrop && !pickerJustOpened()) closePicker(); });
  pk.grid.addEventListener("click", function(e){
    if(pickerJustOpened()) return;
    var b = e.target.closest("button"); if(!b || !pk.uris) return;
    var p = targetPlaylists()[+b.getAttribute("data-i")], uris = pk.uris; closePicker();
    if(!p || !H) return;
    toast("Toevoegen…");
    H.api("POST", "/command", { action: "addToPlaylist", playlistUri: p.uri, uris: uris }).then(function(r){
      if(!r || r.ok === false){ toast((r && r.error) || "Toevoegen mislukt", true); return; }
      toast(addResultText(r, p.name));
    }).catch(function(err){ toast("Toevoegen mislukt: " + (err && err.message || err), true); });
  });

  /* ---------------- tikken op een nummer ----------------
     Een tik telt alleen als de vinger nauwelijks bewoog; scrollen door de
     lijst start dus nooit per ongeluk een nummer. */
  var tap = null;
  function rowFrom(el){
    while(el && el !== els.list){ if(el.classList && el.classList.contains("track")) return el; el = el.parentNode; }
    return null;
  }
  function cancelTap(){
    if(tap && tap.row) tap.row.classList.remove("pressed");
    tap = null;
  }
  els.list.addEventListener("pointerdown", function(e){
    if(e.target.closest && e.target.closest(".addBtn")) return; // ＋ heeft een eigen actie
    var row = rowFrom(e.target);
    if(!row || WS.tap_to_play === false) return; // instelling: dubbeltik speelt niets af
    tap = { row: row, x: e.clientX, y: e.clientY, t: Date.now(), scrollTop: els.list.scrollTop };
    row.classList.add("pressed");
  });
  els.list.addEventListener("pointermove", function(e){
    if(tap && (Math.abs(e.clientX - tap.x) > 10 || Math.abs(e.clientY - tap.y) > 10)) cancelTap();
  });
  els.list.addEventListener("pointercancel", cancelTap);
  els.list.addEventListener("pointerleave", cancelTap);
  els.list.addEventListener("pointerup", function(){
    if(!tap) return;
    var t = tap;
    cancelTap();
    if(Math.abs(els.list.scrollTop - t.scrollTop) > 4) return;
    if(Date.now() - t.t > 800) return;
    if(Date.now() - lastTapAt < 60) return; // dubbele events van één tik negeren
    lastTapAt = Date.now();
    // Enkele tik: regel licht kort op. Dubbeltik: dit nummer afspelen.
    var r = t.row;
    handleTap("tr:" + r.getAttribute("data-track-uri"), r, null, function(){ playRow(r); });
  });
  // ＋ achter een nummer: dat nummer aan een afspeellijst toevoegen.
  els.list.addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest(".addBtn");
    if(!b) return;
    var row = rowFrom(b);
    if(!row) return;
    var name = (row.querySelector(".trackName") || {}).textContent || "";
    openPicker([row.getAttribute("data-track-uri")], "<b>" + escTxt(name) + "</b> toevoegen aan…");
  });
  els.list.addEventListener("scroll", function(){
    if(tap) cancelTap();
  }, { passive: true });
  ["touchstart", "wheel"].forEach(function(ev){
    els.list.addEventListener(ev, function(){ userScrollAt = Date.now(); }, { passive: true });
  });

  function playRow(row){
    var trackUri = row.getAttribute("data-track-uri");
    var trackId = row.getAttribute("data-track-id");
    if(!shown.uri || !trackUri) return;
    haptic();
    userScrollAt = 0;
    highlightTrack(trackId, { force: true, scroll: false });
    els.list.classList.remove("paused");
    send("playTrack", { contextUri: shown.uri, trackUri: trackUri });
  }

  /* ---------------- verbinding met de app ---------------- */
  function fetchState(){
    if(!H) return;
    H.api("GET", "/state").then(applyState).catch(function(err){
      flashError("Geen verbinding met de app: " + (err && err.message || err));
    });
  }

  // Vangnet tegen een "bevroren" webview (zelfde als "Nu speelt").
  setInterval(function(){
    if(document.visibilityState === "visible" && receivedAt && Date.now() - receivedAt > 180000) location.reload();
  }, 30000);

  // Elke 30 s: status ophalen (lokaal, geen Spotify) = "ik ben in beeld".
  setInterval(function(){ if(document.visibilityState === "visible") fetchState(); }, 30000);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") fetchState(); });

  window.onHomeyReady = function(Homey){
    H = Homey;
    try{ WS = Homey.getSettings() || {}; debugOn = !!WS.debug; }catch(e){}
    updatePanorama();
    Homey.on("state", applyState);
    Homey.on("playlist", applyPlaylist);
    var readyDone = false;
    function ready(cfg){
      if(readyDone) return;
      readyDone = true;
      currentHeight = computeHeight(cfg);
      Homey.ready({ height: currentHeight });
      setTimeout(updatePanorama, 50);
    }
    // Eerst de bewaarde lijst tonen (kost geen Spotify), dan de status.
    Homey.api("POST", "/playlist", {})
      .then(function(p){ if(p && p.tracks && !shown.uri) applyPlaylist(p); })
      .catch(function(){})
      .then(function(){ return Homey.api("GET", "/state"); })
      .then(function(s){ ready(s && s.config); applyState(s); })
      .catch(function(err){ ready(null); flashError("Geen verbinding met de app: " + (err && err.message || err)); });
    setTimeout(function(){ ready(null); }, 4000); // nooit blijven hangen op het laadscherm
  };
})();
</script>
</body>
</html>
